{% extends "base.html" %}
{% block title %}Server Error | {{ restaurant_name }}{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">500</div>
  <h2 style="color:#fff;">Something Burned in the Kitchen</h2>
  <p style="color:#e6dfc9;max-width:420px;margin:14px 0 30px;">We hit an unexpected error on our end. Please try again in a moment.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-gold magnetic">Back to Home</a>
</div>
{% endblock %}
